apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fintlabs-no

resources:
  - ../../../base

patches:
  - patch: |-
      - op: replace
        path: "/spec/onePassword/itemPath"
        value: "vaults/aks-beta-vault/items/fint-communication-service"
      - op: add
        path: "/spec/env/-"
        value:
          name: "communication.limits.tenant.default.per-hour"
          value: "8"
      - op: add
        path: "/spec/env/-"
        value:
          name: "communication.limits.tenant.default.per-day"
          value: "100"
      - op: add
        path: "/spec/env/-"
        value:
          name: "communication.limits.total.per-hour"
          value: "8"
      - op: add
        path: "/spec/env/-"
        value:
          name: "communication.limits.total.per-day"
          value: "100"
    target:
      kind: Application
      name: fint-communication-service
