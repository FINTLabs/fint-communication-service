spring:
  application:
    name: fint-communication-service
  datasource:
    url: ${fint.database.url}
    username: ${fint.database.username}
    password: ${fint.database.password}

logging:
  structured:
    format:
      console: logstash
  level:
    com.azure: "off"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

communication:
  limits:
    recipient:
      per-hour: 10
      per-day: 40
    tenant:
      default:
        per-hour: 100
        per-day: 500
    total:
      per-hour: 500
      per-day: 2000
    usage-refresh: 60s
  email:
    provider: logging
    acs:
      operation-timeout: 2m
  dispatch:
    poll-interval: 2s
    batch-size: 10
    lease: 5m
    max-attempts: 8
    initial-backoff: 1m
    max-backoff: 1h
    queue-metrics-refresh: 60s
  retention:
    metadata: 60d
    cleanup-cron: "0 15 3 * * *"
