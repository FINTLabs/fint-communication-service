spring:
  application:
    name: fint-communication-service
  datasource:
    url: ${fint.database.url}
    username: ${fint.database.username}
    password: ${fint.database.password}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

communication:
  limits:
    recipient:
      per-hour: 10
      per-day: 40
  retention:
    metadata: 60d
    cleanup-cron: "0 15 3 * * *"
